<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스탠튼체이스 업무관리</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .category-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        .category-총무 { background-color: #DBEAFE; color: #1E40AF; }
        .category-인사 { background-color: #D1FAE5; color: #065F46; }
        .category-헤드헌팅 { background-color: #E9D5FF; color: #6B21A8; }
        .category-고객관리 { background-color: #FED7AA; color: #9A3412; }
        .category-기타 { background-color: #E5E7EB; color: #374151; }
        
        .progress-bar {
            height: 8px;
            background-color: #E5E7EB;
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- 헤더 -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-gray-800">스탠튼체이스 업무관리</h1>
            <select id="roleSelect" class="border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="COO">COO 모드</option>
                <option value="CEO">CEO 모드</option>
            </select>
        </div>
    </header>

    <div class="max-w-7xl mx-auto px-4 py-6 flex gap-6">
        <!-- 사이드바 -->
        <aside class="w-64 bg-white rounded-lg shadow-sm p-4 h-fit sticky top-24">
            <h2 class="font-bold text-gray-700 mb-4">카테고리</h2>
            <ul id="categoryList" class="space-y-2">
                <li class="category-item cursor-pointer px-3 py-2 rounded-lg hover:bg-gray-100 transition bg-blue-100" data-category="전체">
                    <span class="flex items-center gap-2">
                        <span class="w-3 h-3 rounded-full bg-gray-400"></span>
                        전체
                    </span>
                </li>
                <li class="category-item cursor-pointer px-3 py-2 rounded-lg hover:bg-gray-100 transition" data-category="총무">
                    <span class="flex items-center gap-2">
                        <span class="w-3 h-3 rounded-full bg-blue-500"></span>
                        총무
                    </span>
                </li>
                <li class="category-item cursor-pointer px-3 py-2 rounded-lg hover:bg-gray-100 transition" data-category="인사">
                    <span class="flex items-center gap-2">
                        <span class="w-3 h-3 rounded-full bg-green-500"></span>
                        인사
                    </span>
                </li>
                <li class="category-item cursor-pointer px-3 py-2 rounded-lg hover:bg-gray-100 transition" data-category="헤드헌팅">
                    <span class="flex items-center gap-2">
                        <span class="w-3 h-3 rounded-full bg-purple-500"></span>
                        헤드헌팅
                    </span>
                </li>
                <li class="category-item cursor-pointer px-3 py-2 rounded-lg hover:bg-gray-100 transition" data-category="고객관리">
                    <span class="flex items-center gap-2">
                        <span class="w-3 h-3 rounded-full bg-orange-500"></span>
                        고객관리
                    </span>
                </li>
                <li class="category-item cursor-pointer px-3 py-2 rounded-lg hover:bg-gray-100 transition" data-category="기타">
                    <span class="flex items-center gap-2">
                        <span class="w-3 h-3 rounded-full bg-gray-500"></span>
                        기타
                    </span>
                </li>
            </ul>
        </aside>

        <!-- 메인 영역 -->
        <main class="flex-1">
            <div id="taskGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- 카드들이 여기에 렌더링됩니다 -->
            </div>
        </main>
    </div>

    <script>
        // ============================================
        // STORAGE.JS - 데이터 관리
        // ============================================
        
        const CATEGORIES = ['총무', '인사', '헤드헌팅', '고객관리', '기타'];
        const STATUSES = ['대기', '진행중', '완료', '반려'];
        const STORAGE_KEY = 'stanton_chase_tasks';

        function loadTasks() {
            const data = localStorage.getItem(STORAGE_KEY);
            if (data) {
                return JSON.parse(data);
            }
            return getInitialData();
        }

        function saveTasks(tasks) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
            console.log('✅ 데이터 저장 완료:', tasks.length + '개 업무');
        }

        function getInitialData() {
            const today = new Date().toISOString().split('T')[0];
            const tomorrow = new Date(Date.now() + 86400000).toISOString().split('T')[0];
            const nextWeek = new Date(Date.now() + 7 * 86400000).toISOString().split('T')[0];

            return [
                {
                    id: Date.now() + 1,
                    title: "사무실 비품 구매",
                    description: "프린터 용지 및 사무용품 구매 필요",
                    category: "총무",
                    createdBy: "COO",
                    createdAt: today,
                    dueDate: tomorrow,
                    status: "진행중",
                    progress: 40,
                    subtasks: [
                        { id: "sub1", content: "견적 요청", completed: true },
                        { id: "sub2", content: "구매 승인 받기", completed: false },
                        { id: "sub3", content: "물품 수령", completed: false }
                    ],
                    ceoReview: {
                        checked: false,
                        approved: false,
                        comment: ""
                    }
                },
                {
                    id: Date.now() + 2,
                    title: "신입 채용 면접 일정",
                    description: "마케팅 팀 신입 사원 면접 일정 조율",
                    category: "인사",
                    createdBy: "COO",
                    createdAt: today,
                    dueDate: nextWeek,
                    status: "대기",
                    progress: 0,
                    subtasks: [],
                    ceoReview: {
                        checked: false,
                        approved: false,
                        comment: ""
                    }
                },
                {
                    id: Date.now() + 3,
                    title: "A사 CFO 포지션 진행",
                    description: "후보자 3명 shortlist 완료, 클라이언트 면접 조율 중",
                    category: "헤드헌팅",
                    createdBy: "COO",
                    createdAt: today,
                    dueDate: nextWeek,
                    status: "진행중",
                    progress: 60,
                    subtasks: [
                        { id: "sub4", content: "후보자 추천서 작성", completed: true },
                        { id: "sub5", content: "클라이언트 면접 일정 조율", completed: true },
                        { id: "sub6", content: "면접 후 피드백 수집", completed: false }
                    ],
                    ceoReview: {
                        checked: true,
                        approved: false,
                        comment: "진행 상황 좋습니다. 피드백 받는 대로 보고 바랍니다."
                    }
                }
            ];
        }

        // ============================================
        // APP.JS - 메인 로직
        // ============================================
        
        let tasks = [];
        let currentFilter = '전체';
        let currentRole = 'COO';

        function getStatusIcon(status) {
            const icons = {
                '대기': '⏳',
                '진행중': '🔄',
                '완료': '✅',
                '반려': '❌'
            };
            return icons[status] || '⏳';
        }

        function getProgressColor(progress) {
            if (progress === 0) return 'bg-gray-400';
            if (progress < 50) return 'bg-yellow-400';
            if (progress < 100) return 'bg-blue-500';
            return 'bg-green-500';
        }

        function renderTasks() {
            const grid = document.getElementById('taskGrid');
            
            const filteredTasks = currentFilter === '전체' 
                ? tasks 
                : tasks.filter(t => t.category === currentFilter);
            
            if (filteredTasks.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-12">
                        <p class="text-gray-500 text-lg">업무가 없습니다.</p>
                        <p class="text-gray-400 text-sm mt-2">우측 하단 + 버튼으로 업무를 추가하세요.</p>
                    </div>
                `;
                return;
            }
            
            grid.innerHTML = filteredTasks.map(task => `
                <div class="bg-white rounded-lg shadow-sm p-4 hover:shadow-md transition">
                    <div class="flex justify-between items-start mb-3">
                        <h3 class="font-bold text-gray-800 flex-1 pr-2">${task.title}</h3>
                    </div>
                    
                    <div class="mb-3">
                        <span class="category-badge category-${task.category}">${task.category}</span>
                    </div>
                    
                    <div class="text-sm text-gray-600 mb-3">
                        📅 ${task.dueDate} | ${getStatusIcon(task.status)} ${task.status}
                    </div>
                    
                    <div class="progress-bar mb-1">
                        <div class="progress-fill ${getProgressColor(task.progress)}" style="width: ${task.progress}%"></div>
                    </div>
                    <div class="text-xs text-gray-500 text-right">${task.progress}%</div>
                    
                    ${task.ceoReview.checked ? '<div class="mt-2 text-xs text-green-600">✓ CEO 확인 완료</div>' : ''}
                    ${task.ceoReview.approved ? '<div class="mt-2 text-xs text-blue-600">✓ CEO 승인 완료</div>' : ''}
                </div>
            `).join('');
            
            console.log('✅ 카드 렌더링 완료:', filteredTasks.length + '개');
        }

        function initCategoryFilter() {
            document.querySelectorAll('.category-item').forEach(item => {
                item.addEventListener('click', () => {
                    document.querySelectorAll('.category-item').forEach(i => {
                        i.classList.remove('bg-blue-100');
                    });
                    item.classList.add('bg-blue-100');
                    
                    currentFilter = item.dataset.category;
                    renderTasks();
                    
                    console.log('🔍 필터 적용:', currentFilter);
                });
            });
        }

        function initRoleSelect() {
            const select = document.getElementById('roleSelect');
            
            const savedRole = localStorage.getItem('currentRole');
            if (savedRole) {
                currentRole = savedRole;
                select.value = savedRole;
            }
            
            select.addEventListener('change', (e) => {
                currentRole = e.target.value;
                localStorage.setItem('currentRole', currentRole);
                console.log('👤 역할 변경:', currentRole);
            });
        }

        function init() {
            console.log('🚀 Phase 2 초기화 시작...');
            
            tasks = loadTasks();
            saveTasks(tasks);
            
            renderTasks();
            
            initCategoryFilter();
            initRoleSelect();
            
            console.log('✅ Phase 2 완료!');
            console.log('📋 표시된 업무:', tasks.length + '개');
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
